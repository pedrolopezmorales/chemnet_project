        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "lightgreen", "font": {"color": "black"}, "id": "acetylsalicylic acid", "label": "acetylsalicylic acid", "shape": "ellipse", "size": 55, "title": "Inchikey: BSYNRYMUTXBXSQ-UHFFFAOYSA-N"}, {"color": "#DDD6FE", "font": {"color": "black"}, "id": "National Key Research and Development Program of China", "label": "National Key Research and Development Program of China", "shape": "ellipse", "size": 15, "title": "National Key Research and Development Program of China\n Category: Unknown"}, {"color": "#4ECDC4", "font": {"color": "black"}, "id": "National Natural Science Foundation of China", "label": "National Natural Science Foundation of China", "shape": "ellipse", "size": 15, "title": "National Natural Science Foundation of China\n Category: Foundation"}]);
                  edges = new vis.DataSet([{"color": "red", "from": "acetylsalicylic acid", "title": "Studies: 1", "to": "National Key Research and Development Program of China", "width": 1}, {"color": "red", "from": "acetylsalicylic acid", "title": "Studies: 1", "to": "National Natural Science Foundation of China", "width": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragView": true,
        "hideEdgesOnDrag": false,
        "hideEdgesOnZoom": false,
        "keyboard": {
            "bindToWindow": false,
            "enabled": false
        },
        "maxZoom": 4.0,
        "minZoom": 0.1,
        "wheelSensitivity": 0,
        "zoomSpeed": 1e-59,
        "zoomView": true
    },
    "physics": {
        "barnesHut": {
            "avoidOverlap": 0,
            "centralGravity": 0.3,
            "damping": 0.09,
            "gravitationalConstant": -500,
            "springConstant": 0.002,
            "springLength": 60
        },
        "enabled": true,
        "minVelocity": 0.75,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
    
    <style>
        .controls-container {

    <div class="controls-container">

        <div style="padding:8px 16px;background:#f8f9fa;border-radius:8px;margin:4px 0;">
        <label style="font-size:13px;color:#555;font-weight:500;display:block;margin-bottom:4px;">
            Showing <strong id="slider-label">0 / 0</strong> nodes

        <div id="study-info" style="margin-top:20px; background:#fff; color:#222; padding:10px; border-radius:8px;"></div>
    <script type="text/javascript">
        // Configure zoom options to disable scroll zoom
        network.setOptions({
            interaction: {
                zoomView: true,
                dragView: true,
                wheelSensitivity: 0,  // DISABLE scroll zoom
                minZoom: 0.05,
                maxZoom: 5.0
            }
        });
        
        // AGGRESSIVE SCROLL DISABLE
        setTimeout(function() {
            var visContainers = document.querySelectorAll('.vis-network');
            visContainers.forEach(function(container) {
                container.addEventListener('wheel', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }, { passive: false });
            });
        }, 1000);
        
        // Zoom button functions
        function zoomIn() {
            var scale = network.getScale();
            network.moveTo({
                scale: Math.min(scale * 1.4, 5.0),
                animation: {duration: 400, easingFunction: 'easeOutCubic'}
            });
        }
        
        function zoomOut() {
            var scale = network.getScale();
            network.moveTo({
                scale: Math.max(scale * 0.7, 0.05),
                animation: {duration: 400, easingFunction: 'easeOutCubic'}
            });
        }
        
        function resetZoom() {
            network.moveTo({
                scale: 1.0,
                animation: {duration: 600, easingFunction: 'easeInOutCubic'}
            });
        }
        
        // Study click functionality
        var companyStudyMap = {"National Key Research and Development Program of China": "Water Vapor Condensation Triggers Simultaneous Oxidation and Hydrolysis of Organic Pollutants on Iron Mineral Surfaces (DOI: 10.1021/acs.est.4c03195)", "National Natural Science Foundation of China": "Water Vapor Condensation Triggers Simultaneous Oxidation and Hydrolysis of Organic Pollutants on Iron Mineral Surfaces (DOI: 10.1021/acs.est.4c03195)"};
        network.on("click", function(params) {
            if (params.nodes.length > 0) {
                var nodeId = params.nodes[0];
                var node = nodes.get(nodeId);
                var studies = companyStudyMap[node.label] || "No studies found for this connection.";
                document.getElementById("study-info").innerHTML = "<h3>Studies for " + node.label + ":</h3>" + studies;
            }
        });
    </script>
    
<script type="text/javascript">
    (function() {
        var _cid = "acetylsalicylic acid";
        var _an = nodes.get(), _ae = edges.get();
        var _w = {};
        _ae.forEach(function(e) {
            var m = (e.title||"").match(/(\d+)$/);
            var w = m ? parseInt(m[1]) : 0;
            if (e.from !== _cid) _w[e.from] = Math.max(_w[e.from]||0, w);
            if (e.to !== _cid) _w[e.to] = Math.max(_w[e.to]||0, w);
        });
        var _ids = _an
            .filter(function(n) { return n.id !== _cid; })
            .sort(function(a, b) { return (_w[b.id]||0) - (_w[a.id]||0); })
            .map(function(n) { return n.id; });
        var _tot = _ids.length;
        var _sl = document.getElementById("node-slider");
        _sl.max = _tot || 1;
        _sl.value = _tot;
        document.getElementById("slider-label").textContent = _tot + " / " + _tot;
        _sl.addEventListener("input", function() {
            var cnt = parseInt(this.value);
            var vis = new Set(_ids.slice(0, cnt));
            nodes.update(
                _an.filter(function(n) { return n.id !== _cid; })
                   .map(function(n) { return {id: n.id, hidden: !vis.has(n.id)}; })
            );
            edges.update(
                _ae.map(function(e) {
                    var o = (e.from === _cid) ? e.to : e.from;
                    return {id: e.id, hidden: !vis.has(o)};
                })
            );
            document.getElementById("slider-label").textContent = cnt + " / " + _tot;
        });
    })();
    </script>
